<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot look-around, photoreal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F2; --card:rgba(251,251,247,.93); --ink:#1F2420; --ink2:#4A5248;
  --pine:#24503F; --pine-ink:#FBFBF7; --signal:#C8481A; --rule:#B9BFAF; --well:rgba(31,36,32,.08);
  --shadow:0 1px 2px rgba(31,36,32,.16),0 8px 22px rgba(31,36,32,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#191D1A; --card:rgba(31,36,32,.9); --ink:#EDEFE8; --ink2:#B4BAAF;
    --pine:#8DBFA5; --pine-ink:#14201A; --signal:#EE7B45; --rule:#4A5248; --well:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#191D1A; --card:rgba(31,36,32,.9); --ink:#EDEFE8; --ink2:#B4BAAF;
  --pine:#8DBFA5; --pine-ink:#14201A; --signal:#EE7B45; --rule:#4A5248; --well:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.spot{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  max-width:min(330px,calc(100vw - 24px));background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:10px;padding:11px 14px 12px 12px;box-shadow:var(--shadow);border-left:4px solid var(--pine)}
.spot h1{margin:0;font:700 21px/1.08 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.1px}
.spot p{margin:3px 0 0;font:400 13px/1.35 'Barlow',system-ui,sans-serif;color:var(--ink2)}
.spots{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;background:var(--well);border-radius:8px;margin-bottom:10px}
.spots button{min-height:32px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:600 13px/1 'Barlow',system-ui,sans-serif;cursor:pointer}
.spots button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.readout{margin-top:9px;display:flex;gap:16px}
.readout div{display:flex;flex-direction:column;min-width:0}
.readout b{font:700 22px/1 'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.readout b.view{color:var(--signal)}
.readout span{margin-top:2px;font:500 12px/1.2 'Barlow',system-ui,sans-serif;color:var(--ink2)}

.dock{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:188px;display:flex;flex-direction:column;gap:4px;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:6px;border-radius:12px;box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--well);border-radius:8px;margin-bottom:2px}
.seg button{min-height:36px;border:0;border-radius:6px;background:transparent;color:var(--ink);
  font:600 15px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.2px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:0 8px 0 10px;
  border:0;border-radius:8px;background:transparent;color:var(--ink);font:500 14px/1.2 'Barlow',system-ui,sans-serif;text-align:left;cursor:pointer}
.tog:hover{background:var(--well)}
.sw{width:32px;height:19px;border-radius:10px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed="true"] .sw{background:var(--pine)}
.tog.paint[aria-pressed="true"] .sw{background:var(--signal)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(13px)}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58%);transform:translateX(-50%);
  max-width:calc(100vw - 32px);padding:9px 14px;border-radius:20px;background:rgba(31,36,32,.78);color:#F6F7F2;
  font:500 14px/1.3 'Barlow',system-ui,sans-serif;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#pill.on{opacity:1}

#stick{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;
  border:2px solid rgba(251,251,247,.75);background:rgba(31,36,32,.2);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(251,251,247,.92);box-shadow:0 2px 6px rgba(0,0,0,.25)}

#loading{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;
  padding:24px;transition:opacity .4s;z-index:5}
#loading.done{opacity:0;pointer-events:none}
.lbox{width:min(360px,100%)}
.lbox h2{margin:0 0 6px;font:700 30px/1.05 'Barlow Condensed','Arial Narrow',sans-serif}
.lbox p{margin:0 0 16px;font:400 15px/1.45 'Barlow',system-ui,sans-serif;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--well);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pine);transition:width .1s}

@media (max-width:560px){
  .spot h1{font-size:19px}
  .readout{gap:12px}
  .readout b{font-size:20px}
  .dock{width:172px}
  .tog{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D look-around of the candidate spot"></canvas>

<section class="spot" aria-live="polite">
  <div class="spots" role="group" aria-label="Sample spot">
    <button data-spot="overlook" aria-pressed="true">Overlook</button>
    <button data-spot="clearing" aria-pressed="false">Clearing</button>
    <button data-spot="lake" aria-pressed="false">Lakeshore</button>
  </div>
  <h1 id="sTitle">Flat pull-off above the east valley</h1>
  <p id="sSub">Open grassy bench on a rim, big view east over a valley and lake.</p>
  <div class="readout">
    <div><b class="view" id="rAcres">0</b><span>acres in view</span></div>
    <div><b id="rArena">0%</b><span>of area loaded</span></div>
    <div><b id="rTrees">0</b><span>trees drawn</span></div>
  </div>
</section>

<nav class="dock" aria-label="View controls">
  <div class="seg" role="group" aria-label="Season">
    <button id="bSummer" aria-pressed="true">Summer</button>
    <button id="bWinter" aria-pressed="false">Winter</button>
  </div>
  <button class="tog paint" id="bPaint" aria-pressed="false">Paint what I can see<span class="sw"></span></button>
  <button class="tog" id="bUnloaded" aria-pressed="false">Show unloaded area<span class="sw"></span></button>
  <button class="tog" id="bOver" aria-pressed="false">Overhead<span class="sw"></span></button>
</nav>

<div id="stick"><div id="knob"></div></div>
<div id="pill"></div>

<div id="loading">
  <div class="lbox">
    <h2>Building the arena</h2>
    <p id="lmsg">Checking what's visible from every point you can walk to, for summer and winter.</p>
    <div class="bar"><i id="lbar"></i></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
function boot(SPOT_ID, signal){
let alive = true;

/* ---------- constants ---------- */
const N = 600;            // grid cells per side
const CELL = 10;          // meters per cell
const HALFI = (N-1)/2;
const WALK_R = 100;       // walkable radius in meters (~330 ft)
const EYE = 1.7;          // eye height in meters
const MAXR = 3000;        // viewshed range in meters
const RAYS = 2048, STEP = 0.75;
const SQM_PER_ACRE = 4046.86;

const $ = id => document.getElementById(id);
const pill = $('pill');

if (!window.THREE) { $('lmsg').textContent = 'The 3D library did not load. Check the connection and reload.'; return; }

/* ---------- noise ---------- */
function hash2(ix, iy, s){
  let h = Math.imul(ix|0, 374761393) ^ Math.imul(iy|0, 668265263) ^ Math.imul(s|0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  const a = hash2(ix,iy,s), b = hash2(ix+1,iy,s), c = hash2(ix,iy+1,s), d = hash2(ix+1,iy+1,s);
  return (a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy)*2 - 1;
}
function fbm(x, y, s, oct){
  let v=0, amp=.5, f=1, norm=0;
  for (let o=0;o<oct;o++){ v += amp*vnoise(x*f, y*f, s+o*17); norm += amp; amp *= .5; f *= 2.03; }
  return v/norm;
}
function smooth(a, b, x){ const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); }
const wx = i => (i - HALFI)*CELL;

/* ---------- the sample spots ---------- */
// Each spot is terrain shape + land cover rules, the same inputs real layers would give.
const SPOTS = {
  overlook: {
    title: 'Flat pull-off above the east valley',
    sub: 'Open grassy bench on a rim, big view east over a valley and lake.',
    height(x, z){
      let h = 1900 + fbm(x/1600, z/1600, 11, 5)*170 + fbm(x/420, z/420, 23, 4)*38 + fbm(x/60, z/60, 31, 2)*1.6;
      h += 260*Math.exp(-Math.pow((x+1500)/700, 2))*(0.8 + 0.2*fbm(z/900, x/900, 5, 3));
      { const t = Math.min(1, Math.max(0, (x-30)/1700)); h -= 320*(1 - (1-t)*(1-t)*(1-t)); }
      h -= 75*smooth(45, 230, x)*Math.exp(-Math.pow(z/900, 2));
      h -= 70*(1 - smooth(0, 650, this.lakeD(x, z)));
      return h;
    },
    lakeD(x, z){ const lx = x-1650, lz = z-250; return Math.sqrt(lx*lx*.8 + lz*lz*1.3); },
    flat: [28, 85],
    lake: {
      level(H){ let m = 1e9; for (let j=0;j<N;j++) for (let i=0;i<N;i++) if (SP.lakeD(wx(i), wx(j)) < 380) m = Math.min(m, H[j*N+i]); return m + 13; },
      mask(x, z){ return SP.lakeD(x, z) < 760; }
    },
    road: [[-160,-3100],[-280,-1900],[-120,-900],[-44,-320],[-36,0],[-62,380],[-250,1200],[-170,2100],[-300,3100]], roadW: 5,
    cover(x, z, h, slope, r, rd){
      if (rd < 5) return 20;
      if (slope > 1.0) return 31;
      if (r < 130) return fbm(x/40, z/40, 91, 2) > .42 ? 52 : 71;
      if (rd < 13) return 71;
      const f = fbm(x/350, z/350, 41, 4) - (slope > .55 ? .22 : 0) - (x > 90 && x < 520 && Math.abs(z) < 500 ? .18 : 0);
      const m = fbm(x/700, z/700, 57, 3);
      if (f > -0.06){
        if (h > 1985 || m < -0.18) return 42;
        if (this.lakeD(x, z) < 950 || m > 0.18) return 41;
        return 43;
      }
      return fbm(x/200, z/200, 63, 3) > .12 ? 52 : 71;
    },
    snowyW(x, z, h){ return h > 1840 || fbm(x/120, z/120, 81, 2) > .15; },
    camper: [-20, 6, .06], start: [30, 8, -Math.PI/2, -.04],
    treeClear: 55, loneMin: 135, loneP: .016, canopy: 1
  },

  clearing: {
    title: 'Clearing in the woods',
    sub: 'Small meadow ringed by mixed forest, on a shoulder above a valley to the south.',
    height(x, z){
      let h = 1500 + fbm(x/1400, z/1400, 13, 5)*80 + fbm(x/380, z/380, 27, 4)*22 + fbm(x/60, z/60, 33, 2)*1.2;
      const s = Math.max(0, -z);
      h -= 210*smooth(120, 1700, s);
      h += 150*smooth(1900, 2900, s)*(.7 + .3*fbm(x/700, z/700, 9, 2));
      h += 60*Math.exp(-Math.pow((z-600)/500, 2));
      return h;
    },
    flat: [15, 45],
    lake: null,
    road: [[-40,3100],[60,2200],[-20,1400],[30,700],[-8,260],[4,60],[6,4]], roadW: 4,
    cover(x, z, h, slope, r, rd){
      if (rd < 4) return 20;
      if (slope > 1.0) return 31;
      const a = Math.atan2(z, x);
      const cr = 44 + 12*vnoise(Math.cos(a)*1.6 + 5, Math.sin(a)*1.6 + 5, 401) + 6*vnoise(Math.cos(a)*5 + 9, Math.sin(a)*5 + 9, 402);
      if (r < cr) return fbm(x/25, z/25, 91, 2) > .38 ? 52 : 71;
      if (rd < 9) return 71;
      if (fbm(x/260, z/260, 77, 3) < -.42) return fbm(x/60, z/60, 78, 2) > .1 ? 52 : 71;
      const m = fbm(x/600, z/600, 57, 3) + (z > 0 ? -.12 : .1);
      if (m < -.12) return 42;
      if (m > .12) return 41;
      return 43;
    },
    snowyW(){ return true; },
    camper: [-4, 12, .5], start: [10, -12, 0, -.02],
    treeClear: 14, loneMin: 20, loneP: .035, canopy: 1.2
  },

  lake: {
    title: 'Pull-up on a mountain lakeshore',
    sub: 'Gravel shore on an alpine lake, peaks across the water, conifers behind.',
    lakeQ(x, z){ const dx = (x-700)/680, dz = (z-100)/520; return Math.sqrt(dx*dx + dz*dz) + .05*fbm(x/300, z/300, 501, 3); },
    height(x, z){
      const q = this.lakeQ(x, z);
      let h = 2400 + fbm(x/1500, z/1500, 15, 4)*25 + fbm(x/300, z/300, 25, 4)*9 + fbm(x/50, z/50, 35, 2)*.8;
      h -= 45*(1 - smooth(.72, 1.08, q)) + 60*(1 - smooth(.2, .9, q));
      const far = smooth(1.25, 2.5, q), side = smooth(-300, 900, x)*.8 + .2;
      const rg = 1 - Math.abs(fbm(x/900, z/900, 61, 4));
      h += far*side*(520 + 380*rg*rg + 120*fbm(x/250, z/250, 63, 3));
      h += 180*smooth(0, 1600, -x)*(.8 + .2*fbm(z/600, x/600, 65, 2));
      h += 22*smooth(1.0, 1.4, q);                                   // bank rising back from the shore
      return h;
    },
    flat: [10, 30],
    lake: {
      level(H){ return H[Math.round(HALFI)*N + Math.round(HALFI)] - 1.8; },
      mask(x, z){ return SP.lakeQ(x, z) < 1.3; }
    },
    road: [[-3100,-400],[-2200,-150],[-1300,-260],[-600,-90],[-160,-30],[-30,-6],[-4,0]], roadW: 4,
    cover(x, z, h, slope, r, rd, W){
      const above = h - W;
      if (rd < 4) return 20;
      if ((above < 1.6 && this.lakeQ(x, z) < 1.25) || r < 16) return 32;   // gravel shore and the pull-up pad
      if (above > 620) return fbm(x/180, z/180, 73, 3) > -.05 && slope < 1.2 ? 33 : 31;
      if (slope > .95) return 31;
      if (above > 470) return fbm(x/120, z/120, 75, 2) > .25 ? 31 : 71;
      const tl = 400 + 60*fbm(x/300, z/300, 77, 2);
      if (above > tl) return fbm(x/90, z/90, 79, 2) > .3 ? 42 : 71;
      if (r < 36) return fbm(x/20, z/20, 81, 2) > .3 ? 42 : 71;
      if (rd < 9) return 71;
      if (fbm(x/260, z/260, 83, 3) < -.35) return 71;
      return fbm(x/500, z/500, 85, 2) > .3 ? 43 : 42;
    },
    snowyW(){ return true; },
    camper: [-12, -3, -1.35], start: [6, 6, -Math.PI/2, -.03],
    treeClear: 12, loneMin: 15, loneP: .02, canopy: .9
  }
};
const SP = SPOTS[SPOT_ID];
$('sTitle').textContent = SP.title; $('sSub').textContent = SP.sub;

/* ---------- terrain ---------- */
const H = new Float32Array(N*N);
const LC = new Uint8Array(N*N);      // land cover: 11 water, 20 road, 31 rock, 32 gravel shore, 33 snowfield, 41 deciduous, 42 evergreen, 43 mixed, 52 shrub, 71 grass
const CH = new Float32Array(N*N);    // canopy height (m)
const RD = new Float32Array(N*N).fill(1e9); // distance to road (m)
const surfS = new Float32Array(N*N); // what blocks sight in summer
const surfW = new Float32Array(N*N); // and in winter
const arenaS = new Uint8Array(N*N), arenaW = new Uint8Array(N*N);
const vis = new Uint8Array(N*N);

const h0 = SP.height(0, 0);
for (let j=0;j<N;j++) for (let i=0;i<N;i++){
  const x = wx(i), z = wx(j), r = Math.hypot(x, z);
  const w = 1 - smooth(SP.flat[0], SP.flat[1], r);
  H[j*N+i] = SP.height(x, z)*(1-w) + h0*w;
}
let WATER = -1e9;
if (SP.lake){
  WATER = SP.lake.level(H);
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    const k = j*N+i;
    if (SP.lake.mask(wx(i), wx(j)) && H[k] < WATER){ H[k] = WATER; LC[k] = 11; }
  }
}

function groundAt(x, z){
  let gi = x/CELL + HALFI, gj = z/CELL + HALFI;
  gi = Math.max(0, Math.min(N-1.001, gi)); gj = Math.max(0, Math.min(N-1.001, gj));
  const i = gi|0, j = gj|0, fx = gi-i, fz = gj-j, k = j*N+i;
  const a = H[k], b = H[k+1], c = H[k+N], d = H[k+N+1];
  return a + (b-a)*fx + (c-a)*fz + (a-b-c+d)*fx*fz;
}
function cellAt(x, z){
  const i = Math.round(x/CELL + HALFI), j = Math.round(z/CELL + HALFI);
  return (i < 0 || j < 0 || i >= N || j >= N) ? -1 : j*N+i;
}

// road
const roadCurve = new THREE.CatmullRomCurve3(SP.road.map(p => new THREE.Vector3(p[0], 0, p[1])));
const roadPts = roadCurve.getSpacedPoints(Math.max(200, Math.round(roadCurve.getLength()/4)));
for (const p of roadPts){
  const ci = Math.round(p.x/CELL + HALFI), cj = Math.round(p.z/CELL + HALFI);
  for (let dj=-3; dj<=3; dj++) for (let di=-3; di<=3; di++){
    const i = ci+di, j = cj+dj; if (i<0||j<0||i>=N||j>=N) continue;
    const d = Math.hypot(wx(i)-p.x, wx(j)-p.z), k = j*N+i;
    if (d < RD[k]) RD[k] = d;
  }
}

// slope, land cover, canopy
for (let j=0;j<N;j++) for (let i=0;i<N;i++){
  const k = j*N+i, x = wx(i), z = wx(j), h = H[k];
  const hx = H[j*N + Math.min(N-1,i+1)] - H[j*N + Math.max(0,i-1)];
  const hz = H[Math.min(N-1,j+1)*N + i] - H[Math.max(0,j-1)*N + i];
  const slope = Math.hypot(hx, hz)/(2*CELL);
  const n01 = (fbm(x/90, z/90, 71, 2) + 1)/2;
  if (LC[k] !== 11) LC[k] = SP.cover(x, z, h, slope, Math.hypot(x, z), RD[k], WATER);
  const lc = LC[k];
  CH[k] = (lc===42 ? 17 + 15*n01 : lc===43 ? 13 + 12*n01 : lc===41 ? 10 + 9*n01 : lc===52 ? 1.2 + 1.1*n01 : 0)*(lc===52 ? 1 : SP.canopy);
  surfS[k] = h + CH[k];
  surfW[k] = h + (lc===42 ? CH[k] : lc===43 ? CH[k]*.6 : lc===41 ? CH[k]*.18 : lc===52 ? CH[k]*.5 : 0);
}

/* ---------- viewshed (radial sweep) ---------- */
const RC = new Float32Array(RAYS), RS = new Float32Array(RAYS);
for (let r=0;r<RAYS;r++){ const a = r/RAYS*Math.PI*2; RC[r] = Math.cos(a)*STEP; RS[r] = Math.sin(a)*STEP; }
const MAXSTEPS = Math.floor(MAXR/CELL/STEP);
function viewshed(px, pz, surf, out){
  const gi = px/CELL + HALFI + .5, gj = pz/CELL + HALFI + .5;   // +.5 so |0 rounds
  const eye = groundAt(px, pz) + EYE;
  const dStep = STEP*CELL;
  for (let r=0;r<RAYS;r++){
    const dx = RC[r], dy = RS[r];
    let fi = gi, fj = gj, maxS = -1e9;
    for (let s=1;s<=MAXSTEPS;s++){
      fi += dx; fj += dy;
      if (fi < 0 || fj < 0 || fi >= N || fj >= N) break;
      const d = s*dStep; if (d < 6) continue;

function drawSpray(cx, w, h, snow, seed){

    '#endif',
    '  float gust = 0.6 + 0.4*sin(uTime*0.35 + ip.x*0.004);',
    '  float wv = gust*(sin(uTime*1.6 + ip.x*0.09 + ip.y*0.05) + 0.45*sin(uTime*2.7 - ip.x*0.19 + ip.y*0.23));',
    '  float bnd = position.y*position.y;',
    '  transformed.x += wv*0.13*bnd; transformed.z += wv*0.06*bnd;'
  ].join('\n'));
};

/* ---------- placing trees, shrubs, rocks, grass ---------- */
const NEAR_D = 380, FAR_BUDGET = 80000;
let vegMeshes = [], treeCount = 0, grassMesh = null;
const M4 = new THREE.Matrix4(), CLR = new THREE.Color(), QT = new THREE.Quaternion(), UPV = V(0,1,0), P3 = V(0,0,0), S3 = V(1,1,1);
function setR(m, x, y, z, rot, sx, sy, sz){ QT.setFromAxisAngle(UPV, rot); P3.set(x, y, z); S3.set(sx, sy, sz); m.compose(P3, QT, S3); }
// one list of placements drawn by several meshes (trunk, foliage, core) that share the same transforms
function placeGroup(list, fnM, parts){
  if (!list.length) return;
  const mats = list.map(t => { const m = new THREE.Matrix4(); fnM(t, m); return m; });
  parts.forEach(pt => {
    const mesh = new THREE.InstancedMesh(pt.geo, pt.mat, list.length);
    for (let n=0;n<list.length;n++){
      mesh.setMatrixAt(n, mats[n]);
      if (pt.tint){ pt.tint(list[n], CLR); mesh.setColorAt(n, CLR); }
    }
    mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    if (pt.cast){ mesh.castShadow = true; if (pt.depth) mesh.customDepthMaterial = pt.depth; }
    mesh.receiveShadow = pt.recv !== false;
    scene.add(mesh); vegMeshes.push(mesh);
  });
}
const tintLin = (c, r, g, b) => c.setRGB(r, g, b).convertSRGBToLinear();

function buildTrees(ar, winter){
  vegMeshes.forEach(t => { scene.remove(t); t.dispose && t.dispose(); }); vegMeshes = [];
  const E = [], D = [], S = [], R = [];
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    const k = j*N+i; if (!ar[k]) continue;
    const lc = LC[k]; if (lc===11||lc===20) continue;
    const x = wx(i), z = wx(j), dist = Math.hypot(x, z), r0 = hash2(i, j, 9);
    const rockN = lc===31 ? (dist < 400 ? 2 : (dist < 1500 && r0 < .18 ? 1 : 0)) : lc===32 ? (dist < 600 && r0 < .1 ? 1 : 0) : ((dist < 450 && (lc===71||lc===52) && r0 > .972) ? 1 : 0);
    if (rockN){
      const nr = rockN;
      for (let q=0;q<nr;q++){
        const a = hash2(i,j,900+q), b = hash2(i,j,950+q), s = lc===31 ? 1 + 2.4*hash2(i,j,990+q) : .35 + 1.2*a;
        const tx = x + (a-.5)*CELL, tz = z + (b-.5)*CELL;
        R.push([tx, groundAt(tx, tz) - s*.12, tz, s, a, b]);
      }
    }
    if (lc===31 || lc===32 || lc===33 || RD[k] < 9 || dist < SP.treeClear) continue;
    let n = 0;
    if (lc===41||lc===42||lc===43) n = dist < NEAR_D ? 1 + (r0 < .6 ? 1 : 0) : dist < 1200 ? 1 + (r0 < .3 ? 1 : 0) : dist < 2000 ? (r0 < .8 ? 1 : 0) : (r0 < .55 ? 1 : 0);
    else if (lc===52) n = dist < 600 ? 1 + (r0 < .4 ? 1 : 0) : 0;
    else if (lc===71) n = (dist > SP.loneMin && r0 < SP.loneP) ? 1 : 0;
    for (let q=0;q<n;q++){
      const r1 = hash2(i,j,100+q), r2 = hash2(i,j,200+q), r3 = hash2(i,j,300+q), r4 = hash2(i,j,400+q);
      const tx = x + (r1-.5)*CELL, tz = z + (r2-.5)*CELL, y = groundAt(tx, tz) - .2, d = Math.hypot(tx, tz);
      if (lc===52){ S.push([tx, y, tz, CH[k]*(.7+.6*r3), r4, d]); continue; }
      const h = lc===71 ? 14 + 8*r3 : CH[k]*(.72 + .4*r3);
      const isE = lc===42 || lc===71 || (lc===43 && r4 < .55);
      (isE ? E : D).push([tx, y, tz, h, r4, d]);
    }
  }
  const near = a => a.filter(t => t[5] < NEAR_D);
  let Ef = E.filter(t => t[5] >= NEAR_D), Df = D.filter(t => t[5] >= NEAR_D);
  if (Ef.length + Df.length > FAR_BUDGET){
    const keep = FAR_BUDGET/(Ef.length + Df.length), thin = a => a.filter(t => hash2(t[0]|0, t[2]|0, 7) < keep);
    Ef = thin(Ef); Df = thin(Df);
  }
  const En = near(E), Dn = near(D);
  const mTree = (w0) => (t, m) => { const w = w0 + .22*hash2(t[0]|0, t[2]|0, 3); setR(m, t[0], t[1], t[2], t[4]*6.2832, t[3]*w, t[3], t[3]*w); };
  const conTint = (t, c) => { const v = .82 + .3*t[4]; c.setRGB(v*.96, v, v*.94); };
  const broTint = (t, c) => { const v = .85 + .28*t[4], y = hash2(t[0]|0, t[2]|0, 8); c.setRGB(v*(1 + .1*y), v, v*(.95 - .1*y)); };

  placeGroup(En, mTree(.9), [
    { geo:G.conTrunk, mat:MAT.barkC, cast:true },
    { geo:G.conCore, mat:winter ? MAT.coreW : MAT.core, depth:winter ? DMAT.coreW : DMAT.core, cast:true, tint:conTint },
    { geo:G.conSpray, mat:winter ? MAT.sprayW : MAT.spray, depth:winter ? DMAT.sprayW : DMAT.spray, cast:true, tint:conTint }
  ]);
  placeGroup(Dn, mTree(.88), winter ? [
    { geo:G.bareTrunk, mat:MAT.barkA, cast:true },
    { geo:G.bareTwig, mat:MAT.twig, depth:DMAT.twig, cast:true }
  ] : [
    { geo:G.broTrunk, mat:MAT.barkA, cast:true },
    { geo:G.broLeaf, mat:MAT.leaf, depth:DMAT.leaf, cast:true, tint:broTint }
  ]);
  placeGroup(S, (t, m) => setR(m, t[0], t[1], t[2], t[4]*6.2832, t[3]*1.1, t[3], t[3]*1.1), [
    winter ? { geo:G.shrubW, mat:MAT.twig, depth:DMAT.twig, cast:true, tint:(t, c) => c.setRGB(.8, .72, .62) }
           : { geo:G.shrubS, mat:MAT.leaf, depth:DMAT.leaf, cast:true, tint:(t, c) => { const v = .7 + .25*t[4]; c.setRGB(v*.9, v, v*.8); } }
  ]);
  placeGroup(R, (t, m) => setR(m, t[0], t[1], t[2], t[4]*6.2832, t[3]*1.25, t[3]*.75, t[3]), [
    { geo:G.rock, mat:MAT.rock, cast:true, tint:(t, c) => { const v = .55 + .25*t[5]; winter ? tintLin(c, v*1.02, v, v*.97) : tintLin(c, v, v*.97, v*.9); } }
  ]);
  placeGroup(Ef, (t, m) => { const w = .9 + .25*hash2(t[0]|0, t[2]|0, 3); setR(m, t[0], t[1], t[2], t[4]*6.2832, t[3]*w, t[3], t[3]*w); }, [
    { geo:G.impCon, mat:winter ? MAT.impConW : MAT.impCon, depth:winter ? DMAT.impConW : DMAT.impCon, cast:true, tint:conTint }
  ]);
  placeGroup(Df, (t, m) => { const w = .9 + .25*hash2(t[0]|0, t[2]|0, 3); setR(m, t[0], t[1], t[2], t[4]*6.2832, t[3]*w, t[3], t[3]*w); }, [
    { geo:G.impBro, mat:winter ? MAT.impBroW : MAT.impBro, depth:winter ? DMAT.impBroW : DMAT.impBro, cast:true, tint:broTint }
  ]);
  treeCount = En.length + Dn.length + Ef.length + Df.length + S.length;
}

let grassX = 1e9, grassZ = 1e9;
function buildGrass(winter, gx, gz){
  grassX = gx; grassZ = gz;
  if (grassMesh){ scene.remove(grassMesh); grassMesh.dispose && grassMesh.dispose(); grassMesh = null; }
  const T = [], RAD = 140, cr = Math.ceil(RAD/CELL), ci = Math.round(gx/CELL + HALFI), cj = Math.round(gz/CELL + HALFI);
  for (let j=cj-cr;j<=cj+cr;j++) for (let i=ci-cr;i<=ci+cr;i++){
    if (i < 0 || j < 0 || i >= N || j >= N) continue;
    const k = j*N+i, x = wx(i), z = wx(j), dd = Math.hypot(x - gx, z - gz);
    if (dd > RAD) continue;
    const lck = LC[k], forest = lck===41 || lck===42 || lck===43;
    if (lck !== 71 && lck !== 52 && !forest) continue;
    if (RD[k] < 3.2) continue;
    let n = dd < 30 ? 200 : dd < 70 ? 70 : 18;
    if (forest) n = Math.round(n*(lck===42 ? .05 : .16));
    if (winter) n = Math.round(n*.5);
    const patch = (fbm(x/35, z/35, 211, 2) + 1)/2, dry = (fbm(x/230, z/230, 203, 3) + 1)/2;
    for (let q=0;q<n;q++){
      const r1 = hash2(i,j,500+q), r2 = hash2(i,j,600+q), r3 = hash2(i,j,700+q), r4 = hash2(i,j,800+q);
      const tx = x + (r1-.5)*CELL, tz = z + (r2-.5)*CELL;
      const dc = Math.hypot(tx - SP.camper[0], tz - SP.camper[1]); if (dc < 3.2) continue;
      let hgt = (.5 + .75*patch)*(.7 + .5*r3);
      if (dc < 16) hgt *= .35 + .65*smooth(4, 16, dc);           // trampled around the camper
      if (forest) hgt = .22 + .28*r3;                              // low understory under the trees
      if (winter) hgt *= .55;
      T.push([tx, groundAt(tx, tz) - .04, tz, hgt, r4, forest ? -1 : dry]);
    }
  }
  if (!T.length) return;
  grassMesh = new THREE.InstancedMesh(winter ? G.grassW : G.grassS, MAT.grass, T.length);
  for (let n=0;n<T.length;n++){
    const t = T[n], s = .75 + .5*t[4];
    setR(M4, t[0], t[1], t[2], t[4]*40, s, t[3], s); grassMesh.setMatrixAt(n, M4);
    const d = Math.max(0, t[5] - .45)*1.6, v = (t[5] < 0 ? .62 : .88) + .24*hash2(n, 7, 9);
    winter ? CLR.setRGB(v, v, v) : CLR.setRGB(v*(1 + .45*d), v*(1 + .12*d), v*(1 - .35*d));
    grassMesh.setColorAt(n, CLR);
  }
  grassMesh.instanceMatrix.needsUpdate = true; grassMesh.instanceColor.needsUpdate = true;
  grassMesh.frustumCulled = false; grassMesh.receiveShadow = true;
  scene.add(grassMesh);
}

/* ---------- state ---------- */
const state = { season:'summer', paint:false, unloaded:false, over:false };
let px = SP.start[0], pz = SP.start[1], yaw = SP.start[2], pitch = SP.start[3];
let ovYaw = -2.2, ovTilt = .95;
let dirty = true, lastVisX = 1e9, lastVisZ = 1e9, lastVisT = 0;

function curArena(){ return state.season === 'summer' ? arenaS : arenaW; }
function curSurf(){ return state.season === 'summer' ? surfS : surfW; }

function recolor(){
  const base = state.season === 'summer' ? baseS : baseW, ar = curArena();
  for (let k=0;k<N*N;k++){
    let r = base[k*3], g = base[k*3+1], b = base[k*3+2];
    if (state.paint && vis[k]){ r = r*.45 + PAINT[0]*.55; g = g*.45 + PAINT[1]*.55; b = b*.45 + PAINT[2]*.55; }
    else if (state.unloaded && !ar[k]){ r = r*.35 + UNLOADED[0]*.65; g = g*.35 + UNLOADED[1]*.65; b = b*.35 + UNLOADED[2]*.65; }
    tCol[k*3] = r; tCol[k*3+1] = g; tCol[k*3+2] = b;
  }
  tGeo.attributes.color.needsUpdate = true;
}
function computeLive(){
  vis.fill(0);
  viewshed(px, pz, curSurf(), vis);
  let n = 0; for (let k=0;k<N*N;k++) n += vis[k];
  const ac = n*CELL*CELL/SQM_PER_ACRE;
  $('rAcres').textContent = ac < 10 ? ac.toFixed(1) : Math.round(ac).toLocaleString();
  lastVisX = px; lastVisZ = pz; lastVisT = performance.now();
}
function rebuildGeometry(){
  const ar = curArena();
  tGeo.setIndex(new THREE.BufferAttribute(buildIndex(ar, state.unloaded), 1));
  rGeo.setIndex(roadIndex(ar, state.unloaded));
  wGeo.setIndex(waterIndex(ar, state.unloaded));
  let n = 0; for (let k=0;k<N*N;k++) n += ar[k];
  const pc = n/(N*N)*100;
  $('rArena').textContent = (pc < 1 ? pc.toFixed(2) : pc < 10 ? pc.toFixed(1) : Math.round(pc)) + '%';
}
function applySeason(){
  const w = state.season === 'winter';
  const HOR = w ? 0xD9E2E9 : 0xCBD9E2;
  skyU.zen.value.set(w ? 0x7C9FC2 : 0x4D84C4); skyU.hor.value.set(HOR);
  skyU.sunCol.value.set(w ? 0xFFF2E0 : 0xFFE6BF); skyU.gnd.value.set(w ? 0xB9C0C2 : 0x5E6446);
  fog.color.set(HOR);
  const d = w ? V(-.42, .34, .84).normalize() : V(-.28, .62, .73).normalize();
  skyU.sunDir.value.copy(d);
  { const g = groundAt(0, 0); sun.target.position.set(0, g, 0); sun.position.set(d.x*1300, g + d.y*1300, d.z*1300); sun.target.updateMatrixWorld(); }
  sun.color.set(w ? 0xFFF1E2 : 0xFFE9CC); sun.intensity = w ? 1.35 : 1.6;
  rebuildEnv();
  waterMat.color.copy(lin(w ? 0xC9D6DC : 0x1C343B)); waterMat.roughness = w ? .45 : .07; waterMat.envMapIntensity = w ? 1 : .55;
  waterMat.normalScale.set(w ? .08 : .35, w ? .08 : .35);
  roadMat.color.copy(lin(w ? 0xC4BCAB : 0x9E8D6E));
  buildTrees(curArena(), w);
  buildGrass(w, px, pz);
  $('rTrees').textContent = treeCount >= 1000 ? (treeCount/1000).toFixed(1) + 'k' : String(treeCount);
  rebuildGeometry();
  computeLive();
  recolor();
}

/* ---------- controls ---------- */
function press(btn, on){ btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
$('bSummer').onclick = () => { if (state.season==='summer') return; state.season='summer'; press($('bSummer'),1); press($('bWinter'),0); applySeason(); };
$('bWinter').onclick = () => { if (state.season==='winter') return; state.season='winter'; press($('bWinter'),1); press($('bSummer'),0); applySeason(); };
$('bPaint').onclick = () => { state.paint = !state.paint; press($('bPaint'), state.paint); recolor(); };
$('bUnloaded').onclick = () => { state.unloaded = !state.unloaded; press($('bUnloaded'), state.unloaded); rebuildGeometry(); recolor(); };
$('bOver').onclick = () => { state.over = !state.over; press($('bOver'), state.over); setOverhead(); };

function setOverhead(){
  scene.fog = state.over ? null : fog;
  camera.far = state.over ? 12000 : 5200; camera.near = state.over ? 2 : .1; camera.updateProjectionMatrix();
  marker.visible = state.over;
  dirty = true;
}

const keys = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); hideHint();
}, { signal });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; }, { signal });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; }, { signal });

const canvas = $('c'), stick = $('stick'), knob = $('knob');
let stickId = null, stickX = 0, stickY = 0, stickVX = 0, stickVY = 0;
const looks = new Map();
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); hideHint();
  if (!state.over && e.pointerType !== 'mouse' && stickId === null && e.clientX < innerWidth*.45){
    stickId = e.pointerId; stickX = e.clientX; stickY = e.clientY; stickVX = stickVY = 0;
    stick.style.left = stickX + 'px'; stick.style.top = stickY + 'px'; stick.style.display = 'block';
    knob.style.transform = 'translate(0,0)';
  } else looks.set(e.pointerId, { x:e.clientX, y:e.clientY, t:e.pointerType });
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stickId){
    let dx = e.clientX - stickX, dy = e.clientY - stickY; const l = Math.hypot(dx, dy), R = 50;
    if (l > R){ dx *= R/l; dy *= R/l; }
    stickVX = dx/R; stickVY = dy/R; knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    return;
  }
  const L = looks.get(e.pointerId); if (!L) return;
  const dx = e.clientX - L.x, dy = e.clientY - L.y; L.x = e.clientX; L.y = e.clientY;
  if (state.over){ ovYaw -= dx*.006; ovTilt = Math.max(.35, Math.min(1.45, ovTilt + dy*.004)); }
  else {
    const s = L.t === 'mouse' ? .0035 : .0055;
    yaw -= dx*s; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy*s));
  }
  dirty = true;
});
function endPtr(e){
  if (e.pointerId === stickId){ stickId = null; stickVX = stickVY = 0; stick.style.display = 'none'; }
  looks.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());

let hintTimer = null;
function showPill(text, ms){
  pill.textContent = text; pill.classList.add('on');
  clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => pill.classList.remove('on'), ms);
}
let hintShown = false;
function hideHint(){ if (hintShown){ hintShown = false; setTimeout(() => { if (!edgeShown) pill.classList.remove('on'); }, 1200); } }
let edgeShown = false;

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); dirty = true;
}, { signal });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  if (!alive) return;
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (!state.over){
    let f = 0, s = 0;
    if (keys.w || keys.arrowup) f += 1;
    if (keys.s || keys.arrowdown) f -= 1;
    if (keys.a || keys.arrowleft) s -= 1;
    if (keys.d || keys.arrowright) s += 1;
    f += -stickVY; s += stickVX;
    const len = Math.hypot(f, s);
    if (len > 1){ f /= len; s /= len; }
    if (len > .04){
      const speed = keys.shift ? 9 : 4.2, sy = Math.sin(yaw), cy = Math.cos(yaw);
      let nx = px + (-sy*f + cy*s)*speed*dt, nz = pz + (-cy*f - sy*s)*speed*dt;
      const r = Math.hypot(nx, nz);
      if (r > WALK_R){
        nx *= WALK_R/r; nz *= WALK_R/r;
        if (!edgeShown){ edgeShown = true; showPill('Edge of the walk area, about 330 ft out', 1800); setTimeout(() => edgeShown = false, 2200); }
      }
      const kk = cellAt(nx, nz);
      if (kk >= 0 && LC[kk] === 11){ nx = px; nz = pz; }
      px = nx; pz = nz; dirty = true;
    }
    if ((Math.hypot(px - lastVisX, pz - lastVisZ) > 3 && now - lastVisT > 220) ){ computeLive(); if (state.paint) recolor(); }
    if (Math.hypot(px - grassX, pz - grassZ) > 12) buildGrass(state.season === 'winter', px, pz);   // thick grass follows you
    camera.position.set(px, groundAt(px, pz) + EYE, pz);
    camera.rotation.set(pitch, yaw, 0);
  } else {
    const ty = groundAt(0, 0), dist = 4200;
    camera.position.set(Math.sin(ovYaw)*Math.cos(ovTilt)*dist, ty + Math.sin(ovTilt)*dist, Math.cos(ovYaw)*Math.cos(ovTilt)*dist);
    camera.lookAt(0, ty, 0);
    marker.position.set(px, groundAt(px, pz) + 45, pz);
  }
  sky.position.copy(camera.position);
  timeU.value = now/1000;
  rippleNrm.offset.set(now*.000012, now*.00002);
  renderer.render(scene, camera);   // always drawing: the grass and water move
  requestAnimationFrame(frame);
}

/* ---------- build the arena, then start ---------- */
let si = 0;
function buildStep(){
  if (!alive) return;
  const t0 = performance.now();
  while (si < samplePts.length && performance.now() - t0 < 35){
    const p = samplePts[si];
    viewshed(p[0], p[1], surfS, arenaS);
    viewshed(p[0], p[1], surfW, arenaW);
    si++;
  }
  $('lbar').style.width = (si/samplePts.length*100).toFixed(1) + '%';
  if (si < samplePts.length){ setTimeout(buildStep, 0); return; }
  // the walkable area itself is always loaded
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    if (Math.hypot(wx(i), wx(j)) <= WALK_R + CELL*2){ arenaS[j*N+i] = 1; arenaW[j*N+i] = 1; }
  }
  dilate(arenaS); dilate(arenaW);
  applySeason();
  setOverhead();
  $('loading').classList.add('done');
  hintShown = true;
  const coarse = matchMedia('(pointer: coarse)').matches;
  showPill(coarse ? 'Left thumb walks, right thumb looks' : 'WASD to walk, drag to look, Shift to hurry', 0);
  setTimeout(() => { if (hintShown) hideHint(); }, 6000);
  requestAnimationFrame(frame);
}
setTimeout(buildStep, 60);
}

/* ---------- switching spots rebuilds everything on a fresh canvas ---------- */
let ctl = null;
function start(id){
  if (ctl) ctl.abort();
  ctl = new AbortController();
  const old = document.getElementById('c'), c = old.cloneNode(false); old.replaceWith(c);
  document.getElementById('loading').classList.remove('done');
  document.getElementById('lbar').style.width = '0%';
  document.getElementById('pill').classList.remove('on');
  document.querySelectorAll('.spots button').forEach(b => b.setAttribute('aria-pressed', b.dataset.spot === id ? 'true' : 'false'));
  [['bSummer','true'],['bWinter','false'],['bPaint','false'],['bUnloaded','false'],['bOver','false']].forEach(([i, v]) => document.getElementById(i).setAttribute('aria-pressed', v));
  try { history.replaceState(null, '', '#' + id); } catch(e){}
  setTimeout(() => boot(id, ctl.signal), 30);
}
document.querySelectorAll('.spots button').forEach(b => b.onclick = () => { if (b.getAttribute('aria-pressed') !== 'true') start(b.dataset.spot); });
const first = (location.hash || '').slice(1);
start(['overlook','clearing','lake'].includes(first) ? first : 'overlook');
})();
</script>
